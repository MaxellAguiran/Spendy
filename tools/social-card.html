<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spendy social card</title><style>@font-face{font-family:Manrope;src:url(../assets/fonts/manrope-latin-variable.woff2) format("woff2");font-weight:200 800}*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;background:#fffdff;color:#2e2140;font-family:Manrope,sans-serif}.card{position:relative;display:grid;grid-template-columns:1fr 440px;width:1200px;height:630px;overflow:hidden;padding:60px 68px;background:radial-gradient(circle at 88% 0,rgba(170,146,255,.62),transparent 280px),radial-gradient(circle at 5% 100%,rgba(234,225,255,.95),transparent 320px),#fffdff}.card:before{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(115,80,230,.16) 1px,transparent 1.5px);background-size:25px 25px;content:""}.copy,.visual{position:relative;z-index:1}.copy{display:flex;flex-direction:column;justify-content:space-between}.brand{display:flex;align-items:center;gap:16px;font-size:25px;font-weight:850;letter-spacing:-.06em}.brand img{width:48px;height:48px;border:1.5px solid #2e2140;border-radius:13px;box-shadow:3px 3px 0 #2e2140}.kicker{margin-bottom:20px;color:#6947ca;font-size:16px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}h1{max-width:690px;margin:0;color:#553aa8;font-family:"Snell Roundhand","Bradley Hand",cursive;font-size:65px;font-weight:700;letter-spacing:-.065em;line-height:.96}h1.long{font-size:53px}.subtitle{max-width:640px;margin-top:27px;color:#665a78;font-size:21px;font-weight:700}.visual{display:grid;place-items:end center}.visual img{width:490px;height:430px;object-fit:contain;object-position:right bottom;filter:drop-shadow(0 18px 18px rgba(64,24,116,.17))}</style></head><body><main class="social-card card"><div class="copy"><div class="brand"><img src="../assets/spend-signal-mark.svg" alt=""><span>Spendy</span></div><div><div class="kicker" id="kicker"></div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></div></div><div class="visual"><img src="../assets/spendy-crew-hero.webp" alt=""></div></main><script>const data=new URLSearchParams(location.search),title=data.get('title')||'';document.getElementById('kicker').textContent=data.get('kicker')||'';document.getElementById('title').textContent=title;document.getElementById('title').classList.toggle('long',title.length>54);document.getElementById('subtitle').textContent=data.get('subtitle')||'';</script></body></html>
