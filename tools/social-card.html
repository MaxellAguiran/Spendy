<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spendy social card</title>
  <style>
    @font-face { font-family: Fraunces; src: url(../assets/fonts/fraunces-latin-variable.woff2) format("woff2"); font-weight: 400 800; }
    @font-face { font-family: Manrope; src: url(../assets/fonts/manrope-latin-variable.woff2) format("woff2"); font-weight: 200 800; }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; background: #f6f0e7; color: #181418; font-family: Manrope, sans-serif; }
    .card { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 28px; width: 1200px; height: 630px; overflow: hidden; padding: 52px 58px 48px 64px; border: 1px solid #d8cec8; background: #f6f0e7; }
    .copy { display: flex; flex-direction: column; min-width: 0; }
    .copy > div:last-child { margin-top: 142px; }
    .brand { display: flex; align-items: center; gap: 12px; color: #181418; font-size: 24px; font-weight: 800; letter-spacing: -.045em; }
    .brand img { width: 38px; height: 38px; border: 1px solid #181418; border-radius: 10px; }
    .kicker { margin-bottom: 16px; color: #4c1d45; font-size: 14px; font-weight: 800; letter-spacing: .115em; text-transform: uppercase; }
    h1 { max-width: 680px; margin: 0; color: #181418; font-family: Fraunces, Georgia, serif; font-size: 62px; font-weight: 650; letter-spacing: -.052em; line-height: .98; }
    h1.long { font-size: 51px; }
    .subtitle { max-width: 620px; margin: 21px 0 0; color: #635b61; font-size: 19px; font-weight: 650; line-height: 1.42; }
    .visual { position: relative; display: grid; place-items: end center; min-width: 0; }
    .visual::before { position: absolute; right: 12px; bottom: 18px; width: 320px; height: 320px; border: 1px solid #d8cec8; border-radius: 50%; content: ""; }
    .visual img { position: relative; z-index: 1; width: 450px; height: 385px; object-fit: contain; object-position: center bottom; }
    .visual img.is-background { border: 1px solid #d8cec8; border-radius: 8px; object-fit: cover; object-position: 72% center; }
  </style>
</head>
<body>
  <main class="social-card card">
    <div class="copy">
      <div class="brand"><img src="../assets/spend-signal-mark.svg" alt=""><span>Spendy</span></div>
      <div>
        <div class="kicker" id="kicker"></div>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
    </div>
    <div class="visual"><img id="visual" src="../assets/spendy-crew-hero.webp" alt=""></div>
  </main>
  <script>
    const data = new URLSearchParams(location.search);
    const title = data.get('title') || '';
    document.getElementById('kicker').textContent = data.get('kicker') || '';
    document.getElementById('title').textContent = title;
    document.getElementById('title').classList.toggle('long', title.length > 54);
    document.getElementById('subtitle').textContent = data.get('subtitle') || '';
    const visual = document.getElementById('visual');
    const visualSource = data.get('visual');
    if (visualSource) {
      visual.src = visualSource;
      visual.classList.toggle('is-background', visualSource.includes('evidence-preview-background'));
    }
  </script>
</body>
</html>
