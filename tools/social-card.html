<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spendy social card</title><style>@font-face{font-family:Manrope;src:url(../assets/fonts/manrope-latin-variable.woff2) format("woff2");font-weight:200 800}*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;background:#07110e;color:#f3f7ef;font-family:Manrope,sans-serif}.card{position:relative;display:grid;grid-template-columns:1fr 300px;width:1200px;height:630px;overflow:hidden;padding:68px 74px;background:radial-gradient(circle at 85% 5%,rgba(155,123,255,.5),transparent 270px),radial-gradient(circle at 5% 100%,rgba(217,255,81,.18),transparent 300px),#07110e}.card:before{position:absolute;inset:0;background-image:linear-gradient(rgba(217,255,81,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(217,255,81,.05) 1px,transparent 1px);background-size:38px 38px;content:""}.copy,.visual{position:relative;z-index:1}.copy{display:flex;flex-direction:column;justify-content:space-between}.brand{display:flex;align-items:center;gap:16px;font-size:23px;font-weight:800;letter-spacing:-.05em}.brand img{width:46px;height:46px;border-radius:13px}.kicker{margin-bottom:19px;color:#d9ff51;font-size:16px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{max-width:760px;margin:0;font-size:64px;font-weight:800;letter-spacing:-.075em;line-height:.93}h1.long{font-size:55px}.subtitle{margin-top:26px;color:#c1cec5;font-size:22px;font-weight:650}.visual{display:grid;place-items:center}.orb{position:relative;width:230px;height:230px;border:1px solid rgba(217,255,81,.5);border-radius:50%;box-shadow:0 0 0 35px rgba(217,255,81,.045),0 0 0 80px rgba(155,123,255,.05)}.orb:before{position:absolute;top:59px;left:28px;width:176px;height:80px;border:13px solid #d9ff51;border-left-color:#9b7bff;border-bottom:0;border-radius:100px 100px 0 0;content:""}.orb:after{position:absolute;top:82px;right:21px;width:18px;height:18px;border-radius:50%;background:#d9ff51;box-shadow:0 0 30px #d9ff51;content:""}</style></head><body><main class="social-card card"><div class="copy"><div class="brand"><img src="../assets/spend-signal-mark.svg" alt=""><span>Spendy</span></div><div><div class="kicker" id="kicker"></div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></div></div><div class="visual"><div class="orb"></div></div></main><script>const data=new URLSearchParams(location.search),title=data.get('title')||'';document.getElementById('kicker').textContent=data.get('kicker')||'';document.getElementById('title').textContent=title;document.getElementById('title').classList.toggle('long',title.length>54);document.getElementById('subtitle').textContent=data.get('subtitle')||'';</script></body></html>
