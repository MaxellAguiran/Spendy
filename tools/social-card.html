<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deterministic social-card template</title>
  <style>
    @font-face{font-family:Fraunces;src:url(../assets/fonts/fraunces-latin-variable.woff2) format("woff2");font-weight:100 900}
    @font-face{font-family:Manrope;src:url(../assets/fonts/manrope-latin-variable.woff2) format("woff2");font-weight:200 800}
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f7faf7;color:#12231b}
    .social-card{position:relative;display:grid;width:1200px;height:630px;grid-template-columns:minmax(0,1fr) 330px;overflow:hidden;padding:68px 72px;background:linear-gradient(135deg,#f7faf7 0 63%,#ddf3e7 63% 100%);font-family:Manrope,sans-serif}
    .social-card::after{position:absolute;right:40px;bottom:38px;width:220px;height:220px;border:1px solid rgba(25,122,85,.2);border-radius:50%;content:""}
    .copy{position:relative;z-index:2;display:flex;max-width:785px;flex-direction:column;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:18px;font-size:22px;font-weight:800;letter-spacing:-.02em}.brand img{width:48px;height:48px}
    .kicker{margin-bottom:18px;color:#197a55;font-size:19px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    h1{max-width:820px;margin:0;color:#12231b;font-family:Fraunces,serif;font-size:72px;font-weight:580;letter-spacing:-.045em;line-height:.98}
    h1.long{font-size:59px;line-height:1.01}h1.very-long{font-size:50px;line-height:1.03}
    .subtitle{margin-top:28px;color:#5f6f67;font-size:22px;font-weight:650}
    .visual{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center}.mascot{position:absolute;right:-35px;bottom:-115px;width:430px;filter:drop-shadow(0 20px 24px rgba(18,35,27,.12))}
    .mark-large{width:185px;opacity:.95}.signal{display:none;width:280px;height:240px;align-items:flex-end;gap:18px;padding-bottom:28px;border-bottom:3px solid #8eaa9b}.signal span{flex:1;border-radius:12px 12px 0 0;background:#a8e4c5}.signal span:nth-child(2),.signal span:nth-child(4){background:#197a55}.signal span:nth-child(5){background:#c45a49}
    .signal.allocation span:nth-child(1){height:88%}.signal.allocation span:nth-child(2){height:44%}.signal.allocation span:nth-child(3){height:72%}.signal.allocation span:nth-child(4){height:61%}.signal.allocation span:nth-child(5){height:35%}
    .signal.churn span:nth-child(1){height:95%}.signal.churn span:nth-child(2){height:81%}.signal.churn span:nth-child(3){height:58%}.signal.churn span:nth-child(4){height:43%}.signal.churn span:nth-child(5){height:31%}
    .terracotta{position:absolute;top:0;right:0;width:16px;height:180px;background:#c45a49}
  </style>
</head>
<body>
  <main class="social-card" aria-label="Social preview card">
    <div class="terracotta"></div>
    <div class="copy"><div class="brand"><img src="../assets/dragon-mark.svg" alt=""><span>Maxell Aguiran · Dragon Analytics</span></div><div><div class="kicker" id="kicker"></div><h1 id="title"></h1><div class="subtitle" id="subtitle"></div></div></div>
    <div class="visual"><img class="mascot" id="mascot" src="../assets/dragon-mascot.webp" alt=""><img class="mark-large" id="mark" src="../assets/dragon-mark.svg" alt=""><div class="signal" id="signal"><span></span><span></span><span></span><span></span><span></span></div></div>
  </main>
  <script>
    const data=new URLSearchParams(location.search);const title=data.get('title')||'Untitled';
    document.getElementById('kicker').textContent=data.get('kicker')||'';document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=data.get('subtitle')||'';
    document.getElementById('title').classList.toggle('long',title.length>48);document.getElementById('title').classList.toggle('very-long',title.length>68);
    const mascot=data.get('mascot')==='true';document.getElementById('mascot').style.display=mascot?'block':'none';document.getElementById('mark').style.display=mascot||data.get('signal')?'none':'block';
    const signal=data.get('signal');if(signal){const element=document.getElementById('signal');element.style.display='flex';element.classList.add(signal)}
  </script>
</body>
</html>
